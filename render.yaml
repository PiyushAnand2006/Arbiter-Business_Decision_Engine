# Render Blueprint: one free web service built from the Dockerfile.
# Deploy: https://render.com/deploy?repo=https://github.com/PiyushAnand2006/PiyushAnand2006-Arbiter-Business_Decision_Engine
services:
  - type: web
    name: arbiter
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: mock
